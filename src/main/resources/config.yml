ffmpeg-path: ffmpeg
fps: 8
max-screen-width: 4
max-screen-height: 3
view-distance: 32

audio:
  # single: one continuous OGG per video; segments: legacy four-second audio
  mode: single
  pack-url: '' # Public HTTPS URL of RTE-Cinema-Audio.zip
  pack-format: 97 # Minecraft 26.3
  volume: 1.0
  # Positive delays audio; negative starts it earlier (milliseconds)
  offset-ms: 0
  debug: false
